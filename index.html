<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unjumble · brain dump organizer</title>
  <style>
    :root { --ink: #20262f; --muted: #6f7883; --paper: #f6f4ef; --white: #fffefa; --line: #e5e1d8; --red: #e85e55; --yellow: #e8ad3f; --green: #64a477; --blue: #506b94; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 92% 8%, #dfeae5 0, transparent 32%), var(--paper); font-family: 'Trebuchet MS', sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1120px; margin: auto; padding: 30px 28px 15px; }
    .brand { display: flex; align-items: center; gap: 10px; font: 800 24px Georgia, serif; }
    .mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 8px; color: var(--white); background: var(--blue); font: 700 17px sans-serif; }
    .privacy { color: var(--muted); font-size: 12px; }
    main { max-width: 1120px; margin: auto; padding: 55px 28px 80px; }
    .hero { max-width: 690px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 12px 0 16px; font: 500 clamp(48px, 8vw, 86px)/.9 Georgia, serif; letter-spacing: -3px; }
    .intro { max-width: 570px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .composer { max-width: 760px; margin-top: 32px; }
    textarea { display: block; width: 100%; min-height: 145px; padding: 18px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; outline: 0; color: var(--ink); background: var(--white); box-shadow: 0 8px 24px rgb(32 38 47 / 6%); font: 16px/1.5 sans-serif; }
    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px #dfe7f1; }
    .composer-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .hint { color: var(--muted); font-size: 12px; }
    .composer-message { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .due-input { display: flex; align-items: center; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--white); font: 12px sans-serif; }
    .time-select { padding: 3px; border: 0; color: var(--ink); background: var(--white); font: 12px sans-serif; }
    button { border: 0; border-radius: 5px; color: var(--white); background: var(--blue); font: 700 13px sans-serif; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    .sort-button { padding: 12px 18px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 60px; }
    .column { min-height: 230px; padding: 18px; border: 1px solid var(--line); border-top: 4px solid var(--green); border-radius: 7px; background: rgb(255 254 250 / 80%); }
    .column.important { border-top-color: var(--red); }
    .column.week { border-top-color: var(--yellow); }
    .column h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 15px; font: 700 18px Georgia, serif; }
    .column h2 span { color: var(--muted); font: 11px sans-serif; }
    .task-list { display: grid; gap: 9px; }
    .task { display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: start; padding: 13px; border: 1px solid var(--line); border-radius: 5px; background: var(--white); box-shadow: 2px 3px 0 rgb(32 38 47 / 4%); }
    .task.done { opacity: .55; }
    .task.done .task-text { text-decoration: line-through; }
    .check { width: 19px; height: 19px; border: 1px solid #bac2ca; border-radius: 50%; color: var(--white); background: var(--white); font-size: 11px; }
    .task.done .check { border-color: var(--green); background: var(--green); }
    .task-text { min-width: 0; font: 14px/1.4 Georgia, serif; }
    .task-meta { margin-top: 5px; color: var(--muted); font: 10px sans-serif; }
    .move { padding: 4px 6px; color: var(--muted); background: transparent; font-size: 11px; }
    .move:hover { color: var(--blue); }
    .delete { padding: 4px 6px; color: #b44d49; background: transparent; font-size: 11px; }
    .delete:hover { color: #8e2925; }
    .why { grid-column: 2 / 4; padding: 0; color: var(--muted); background: transparent; text-align: left; font: 11px/1.4 sans-serif; }
    .why:hover { color: var(--blue); }
    .reason { grid-column: 2 / 4; margin-top: -3px; color: var(--muted); font: 11px/1.4 sans-serif; }
    .empty { padding: 18px 4px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) { header { padding: 22px 20px 10px; } main { padding: 40px 20px 60px; } .privacy { display: none; } .board { grid-template-columns: 1fr; margin-top: 40px; } .composer-footer { align-items: flex-start; gap: 14px; flex-direction: column; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="mark">↯</span>Unjumble</div><div class="privacy">Your brain dump stays in this browser</div></header>
  <main>
    <section class="hero">
      <div class="eyebrow">Make room in your head</div>
      <h1>Put it all<br>down.</h1>
      <p class="intro">Write everything stressing you out. Unjumble will turn the swirl into a small, doable list.</p>
      <form class="composer" id="composer">
        <textarea id="dump" aria-label="Brain dump" placeholder="I have a math test Friday, my room is messy, I need to email my teacher..."></textarea>
        <div class="composer-footer"><span class="hint">Separate thoughts with commas, “and”, or new lines.</span><label class="due-input">Optional time <select class="time-select" id="due-hour" aria-label="Hour"><option value="">Hour</option></select><span>:</span><select class="time-select" id="due-minute" aria-label="Minute"><option value="">Min</option></select><select class="time-select" id="due-period" aria-label="AM or PM"><option value="">AM/PM</option><option>AM</option><option>PM</option></select></label><button class="sort-button" type="submit">Unjumble this</button></div>
        <div class="composer-message" id="composer-message" aria-live="polite"></div>
      </form>
    </section>
    <section class="board" aria-live="polite">
      <div class="column important"><h2><span>🔴</span>Important <span id="important-count">0</span></h2><div class="task-list" id="important"></div></div>
      <div class="column week"><h2><span>🟡</span>This week <span id="week-count">0</span></h2><div class="task-list" id="week"></div></div>
      <div class="column later"><h2><span>🟢</span>Later <span id="later-count">0</span></h2><div class="task-list" id="later"></div></div>
    </section>
  </main>
  <script>
    const savedTasks = JSON.parse(localStorage.getItem('unjumble-tasks') || 'null');
    const tasks = savedTasks && savedTasks.important && savedTasks.week && savedTasks.later ? savedTasks : { important: [], week: [], later: [] };
    const urgencyWords = /due\s+(today|tonight|tomorrow)|by\s+(today|tonight|tomorrow)|before\s+[^,.]*tomorrow|in\s+\d+\s+hours?|urgent|asap|really\s+need|exam\s+(today|tomorrow)|test\s+(today|tomorrow)|application\s+(closes|due)|closes?\s+(tonight|today)|doctor\s+appointment|meeting\s+at|deadline|must\s+do|before\s+i\s+can/i;
    const weekWords = /by\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)|this week|before the weekend|next week|next month|soon|prepare for|start studying|before\s+[^,.]*(hackathon|exam|test)|email|call|practice|study|buy|book/i;
    const taskVerbs = /^(?:i\s+)?(?:need to|have to|should|must|remember to|want to|forgot to)\s+/i;
    const typoFixes = { studdy: 'study', tomorow: 'tomorrow', tommorrow: 'tomorrow', emial: 'email', teh: 'the', prject: 'project', practce: 'practice', assigment: 'assignment', mathh: 'math', befor: 'before', tset: 'test' };
    function repairTypos(value) { return value.replace(/[A-Za-z]+/g, word => typoFixes[word.toLowerCase()] || word); }
    function cleanTask(value) { return repairTypos(value).trim().replace(/^[,.;:\-\s]+|[,.;:\-\s]+$/g, '').replace(taskVerbs, '').replace(/^i\s+(?:have|need)\s+/i, '').replace(/\s+/g, ' '); }
    function looksUnderstandable(value) { const words = value.trim().split(/\s+/).filter(Boolean); return words.length >= 2 && /[aeiou]/i.test(value) && /[a-z]{3}/i.test(value); }
    function categoryFor(task) { if (urgencyWords.test(task)) return { category: 'important', reason: 'Immediate deadline, urgency, consequence, or time-sensitive event.' }; if (weekWords.test(task)) return { category: 'week', reason: 'A near-term deadline or preparation is mentioned.' }; return { category: 'later', reason: 'No immediate deadline or urgency was detected.' }; }
    function splitDump(value) { return value.replace(/[.!?]+/g, ',').replace(/\s+and\s+/gi, ',').split(/[\n,]+/).map(cleanTask).filter(task => task.length > 2); }
    function breakDown(task) { if (/science project|project.*due/i.test(task) && /research|presentation|practice|haven't started|not started/i.test(task)) return [{ text: 'Start science project', forced: 'important', reason: 'The project is due and has not started.' }, { text: 'Research topic', forced: 'important', reason: 'Research is a dependency for the project.' }, { text: 'Make presentation', forced: 'week', reason: 'This is a project step to complete before the deadline.' }, { text: 'Practice presentation', forced: 'week', reason: 'Practice is a project step to complete before presenting.' }]; return [{ text: task }]; }
    for (let hour = 1; hour <= 12; hour += 1) document.querySelector('#due-hour').insertAdjacentHTML('beforeend', `<option value="${hour}">${hour}</option>`);
    for (let minute = 1; minute <= 60; minute += 1) document.querySelector('#due-minute').insertAdjacentHTML('beforeend', `<option value="${minute}">${String(minute).padStart(2, '0')}</option>`);
    function saveTasks() { localStorage.setItem('unjumble-tasks', JSON.stringify(tasks)); }
    function addTask(text, due, forcedCategory, suppliedReason) { const classification = categoryFor(text); const category = forcedCategory || classification.category; tasks[category].push({ text, due, reason: suppliedReason || classification.reason, done: false, id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}` }); }
    function formatDue(due) { return due ? ` · ${due.hour}:${String(due.minute).padStart(2, '0')} ${due.period}` : ''; }
    function render() {
      Object.entries(tasks).forEach(([category, items]) => {
        const list = document.querySelector(`#${category}`);
          list.innerHTML = items.length ? items.map(task => `<article class="task${task.done ? ' done' : ''}" data-id="${task.id}"><button class="check" aria-label="Mark task complete">${task.done ? '✓' : ''}</button><div><div class="task-text">${escapeHtml(task.text)}</div><div class="task-meta">${task.done ? 'Done' : category === 'important' ? 'Needs attention' : category === 'week' ? 'On your radar' : 'No rush'}${formatDue(task.due)}</div></div><button class="move" aria-label="Move task">Move</button><button class="delete" aria-label="Delete task">Delete</button><button class="why" aria-expanded="false">Why?</button><div class="reason" hidden>${escapeHtml(task.reason || 'Sorted from the context in your brain dump.')}</div></article>`).join('') : '<div class="empty">Nothing here yet.</div>';
        document.querySelector(`#${category}-count`).textContent = items.length;
      });
      document.querySelectorAll('.check').forEach(button => button.addEventListener('click', event => { const task = findTask(event.currentTarget.closest('.task').dataset.id); task.done = !task.done; saveTasks(); render(); }));
      document.querySelectorAll('.move').forEach(button => button.addEventListener('click', event => moveTask(event.currentTarget.closest('.task').dataset.id)));
      document.querySelectorAll('.delete').forEach(button => button.addEventListener('click', event => deleteTask(event.currentTarget.closest('.task').dataset.id)));
      document.querySelectorAll('.why').forEach(button => button.addEventListener('click', event => { const reason = event.currentTarget.nextElementSibling; reason.hidden = !reason.hidden; event.currentTarget.setAttribute('aria-expanded', String(!reason.hidden)); }));
    }
    function findTask(id) { return Object.values(tasks).flat().find(task => task.id === id); }
    function moveTask(id) { const task = findTask(id); const current = Object.keys(tasks).find(category => tasks[category].includes(task)); const next = current === 'important' ? 'week' : current === 'week' ? 'later' : 'important'; tasks[current] = tasks[current].filter(item => item !== task); tasks[next].push(task); saveTasks(); render(); }
    function deleteTask(id) { Object.keys(tasks).forEach(category => { tasks[category] = tasks[category].filter(task => task.id !== id); }); saveTasks(); render(); }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
    document.querySelector('#composer').addEventListener('submit', event => { event.preventDefault(); const dump = document.querySelector('#dump'); const message = document.querySelector('#composer-message'); if (!looksUnderstandable(dump.value)) { message.textContent = 'Try writing an action, like “email my teacher” or “study for math.” I could not find a clear task in that text.'; dump.focus(); return; } const hour = document.querySelector('#due-hour').value; const minute = document.querySelector('#due-minute').value; const period = document.querySelector('#due-period').value; const due = hour && minute && period ? { hour, minute, period } : null; const repairedText = repairTypos(dump.value); const parsedTasks = /science project|presentation.*practice/i.test(repairedText) ? breakDown(repairedText) : splitDump(repairedText).flatMap(breakDown); parsedTasks.forEach(task => addTask(task.text, due, task.forced, task.reason)); message.textContent = repairedText !== dump.value ? 'I cleaned up a few likely typos and sorted your tasks.' : 'Tasks added and sorted.'; dump.value = ''; document.querySelector('#due-hour').value = ''; document.querySelector('#due-minute').value = ''; document.querySelector('#due-period').value = ''; saveTasks(); render(); dump.focus(); });
    render();
  </script>
</body>
</html>
