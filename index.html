<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unjumble</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: light-dark(#0f766e, #5eead4);
    --accent-contrast: light-dark(#ffffff, #04211d);
    --important: light-dark(#c1362a, #ff8a70);
    --week: light-dark(#a6740a, #ffc63d);
    --later: light-dark(#0f7a4d, #55e0a0);
    --shadow: light-dark(rgba(20, 20, 20, .1), rgba(0, 0, 0, .55));
    --radius: 8px;
    --font: ui-sans-serif, system-ui, -apple-system, sans-serif;
    --sp-1: .5rem; --sp-2: 1rem; --sp-3: 1.5rem; --sp-4: 2.5rem; --sp-5: 4rem;
  }

  body {
    max-width: 780px;
    margin: 0 auto;
    padding: var(--sp-5) 1.25rem 6rem;
    font-family: var(--font);
    font-weight: 500;
    line-height: 1.55;
    accent-color: var(--accent);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-5); }
  .brand { display: flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1.05rem; }
  .mark {
    display: grid;
    place-items: center;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 800;
    font-size: 1rem;
  }
  .muted { opacity: .65; font-weight: 500; font-size: .875em; }

  h1 {
    margin: 0 0 var(--sp-1);
    font-size: clamp(2.5rem, 6vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: .98;
  }

  main > p { font-weight: 500; }

  form { margin: var(--sp-4) 0 var(--sp-5); }
  form > * { margin-top: var(--sp-3); }
  form > *:first-child { margin-top: 0; }

  textarea {
    display: block;
    width: 100%;
    padding: var(--sp-2);
    font: 500 1rem/1.5 var(--font);
    color: inherit;
    background: transparent;
    border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 1px 3px var(--shadow),
                0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  fieldset {
    padding: var(--sp-2);
    border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: var(--radius);
  }
  legend { padding: 0 .4em; font-size: .875rem; font-weight: 600; }
  select {
    padding: .3em .5em;
    font: 600 inherit;
    color: inherit;
    background: transparent;
    border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: var(--radius);
  }

  button {
    padding: .5em 1em;
    font: 700 inherit;
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
    transition: filter .15s ease, transform .1s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(1px); }

  button[type="submit"] { background: var(--accent); color: var(--accent-contrast); }
  .move { padding: .3em .1em; background: transparent; color: var(--accent); }
  .delete { padding: .3em .1em; background: transparent; color: var(--important); }

  .board { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-4); }
  .board section { flex: 1 1 220px; }
  .board .important { --stripe: var(--important); }
  .board .week { --stripe: var(--week); }
  .board .later { --stripe: var(--later); }

  h2 { display: flex; align-items: center; gap: .5em; margin: 0; font-size: 1.125rem; font-weight: 800; color: var(--stripe); }
  h2 .dot { width: .6em; height: .6em; border-radius: 50%; background: currentColor; flex: none; }
  h2 .count { opacity: .55; font-size: .75em; }

  ul { list-style: none; margin: var(--sp-2) 0 0; padding: 0; }
  li {
    padding: var(--sp-2) 0 var(--sp-2) var(--sp-2);
    border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent);
    border-left: 5px solid var(--stripe, transparent);
    accent-color: var(--stripe, var(--accent));
    transition: opacity .3s ease, background-color .15s ease;
  }
  li:first-child { border-top: 0; }
  li:hover { background: color-mix(in srgb, currentColor 4%, transparent); }
  @starting-style { li { opacity: 0; } }

  li label { display: flex; align-items: baseline; gap: .55em; cursor: pointer; }
  li span { font-weight: 600; font-size: 1.0625rem; transition: opacity .2s ease; }
  li:has(input:checked) span { text-decoration: line-through; opacity: .55; }
  li p { margin: .35em 0 0 1.65em; }
  .task-date { font-weight: 700; color: var(--stripe); }

  details { margin: .35em 0 0 1.65em; }
  summary {
    display: inline-flex;
    align-items: center;
    gap: .35em;
    list-style: none;
    cursor: pointer;
    font-size: .875rem;
    font-weight: 600;
    opacity: .65;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: '\25b8';
    display: inline-block;
    font-size: .75em;
    transition: transform .15s ease;
  }
  details[open] summary::before { transform: rotate(90deg); }
  details p { margin: .35em 0 0; opacity: .65; font-weight: 500; font-size: .875rem; }

  li > button { margin: var(--sp-1) .5em 0 1.65em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark" aria-hidden="true">&#8623;</span>Unjumble</div>
  <p class="muted">Saved on this device</p>
</header>

<main>
  <h1>What&rsquo;s on your mind?</h1>
  <p>Write it all down. We&rsquo;ll sort out what&rsquo;s actually urgent.</p>

  <form id="composer">
    <textarea id="dump" aria-label="Brain dump"
      placeholder="I have a math test Friday, my room is messy, I need to email my teacher..."></textarea>

    <p class="muted">Separate thoughts with commas, &ldquo;and&rdquo;, or new lines.</p>

    <fieldset>
      <legend>Optional time</legend>
      <select id="due-hour" aria-label="Hour"><option value="">Hour</option></select>
      <span>:</span>
      <select id="due-minute" aria-label="Minute"><option value="">Min</option></select>
      <select id="due-period" aria-label="AM or PM">
        <option value="">AM/PM</option>
        <option>AM</option>
        <option>PM</option>
      </select>
    </fieldset>

    <button type="submit">Unjumble this</button>

    <p id="composer-message" class="muted" aria-live="polite"></p>
  </form>

  <div class="board" aria-live="polite">
    <section class="important" aria-labelledby="important-heading">
      <h2 id="important-heading"><span class="dot" aria-hidden="true"></span>Important <span id="important-count" class="count"></span></h2>
      <ul id="important"></ul>
    </section>
    <section class="week" aria-labelledby="week-heading">
      <h2 id="week-heading"><span class="dot" aria-hidden="true"></span>This week <span id="week-count" class="count"></span></h2>
      <ul id="week"></ul>
    </section>
    <section class="later" aria-labelledby="later-heading">
      <h2 id="later-heading"><span class="dot" aria-hidden="true"></span>Later <span id="later-count" class="count"></span></h2>
      <ul id="later"></ul>
    </section>
  </div>
</main>

<script>
  const savedTasks = JSON.parse(localStorage.getItem('unjumble-tasks') || 'null');
  const tasks = savedTasks && savedTasks.important && savedTasks.week && savedTasks.later
    ? savedTasks
    : { important: [], week: [], later: [] };

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const urgencyWords = /due\s+(today|tonight|tomorrow)|by\s+(today|tonight|tomorrow)|before\s+[^,.]*tomorrow|in\s+\d+\s+hours?|urgent|asap|really\s+need|exam\s+(today|tomorrow)|test\s+(today|tomorrow)|application\s+(closes|due)|closes?\s+(tonight|today)|doctor\s+appointment|meeting\s+at|deadline|must\s+do|before\s+i\s+can/i;
  const weekWords = /by\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)|this week|before the weekend|next week|next month|soon|prepare for|start studying|before\s+[^,.]*(hackathon|exam|test)|email|call|practice|study|buy|book/i;
  const taskVerbs = /^(?:i\s+)?(?:need to|have to|should|must|remember to|want to|forgot to)\s+/i;
  const typoFixes = { studdy: 'study', tomorow: 'tomorrow', tommorrow: 'tomorrow', emial: 'email', teh: 'the', prject: 'project', practce: 'practice', assigment: 'assignment', mathh: 'math', befor: 'before', tset: 'test' };

  function repairTypos(value) {
    return value.replace(/[A-Za-z]+/g, word => typoFixes[word.toLowerCase()] || word);
  }

  function cleanTask(value) {
    return repairTypos(value).trim()
      .replace(/^[,.;:\-\s]+|[,.;:\-\s]+$/g, '')
      .replace(taskVerbs, '')
      .replace(/^i\s+(?:have|need)\s+/i, '')
      .replace(/\s+/g, ' ');
  }

  function looksUnderstandable(value) {
    const words = value.trim().split(/\s+/).filter(Boolean);
    return words.length >= 2 && /[aeiou]/i.test(value) && /[a-z]{3}/i.test(value);
  }

  function dateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function nextWeekday(name) {
    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    const target = days.indexOf(name.toLowerCase());
    const result = new Date(today);
    let delta = (target - today.getDay() + 7) % 7;
    if (delta === 0) delta = 7;
    result.setDate(result.getDate() + delta);
    return result;
  }

  function exactDateFor(text) {
    const lower = text.toLowerCase();
    let result = new Date(today);
    if (/today|tonight/.test(lower)) return dateKey(result);
    if (/tomorrow/.test(lower)) { result.setDate(result.getDate() + 1); return dateKey(result); }

    const inDays = lower.match(/in\s+(\d+)\s+days?/);
    if (inDays) { result.setDate(result.getDate() + Number(inDays[1])); return dateKey(result); }

    const weekday = lower.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
    if (weekday) return dateKey(nextWeekday(weekday[1]));

    const fullDate = lower.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})(?:,?\s+(\d{4}))?/);
    if (fullDate) {
      const year = fullDate[3] ? Number(fullDate[3]) : today.getFullYear();
      const parsed = new Date(`${fullDate[1]} ${fullDate[2]}, ${year}`);
      if (parsed < today && !fullDate[3]) parsed.setFullYear(year + 1);
      return Number.isNaN(parsed.valueOf()) ? null : dateKey(parsed);
    }

    const slashDate = lower.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/);
    if (slashDate) {
      const parsed = new Date(Number(slashDate[3]), Number(slashDate[1]) - 1, Number(slashDate[2]));
      return Number.isNaN(parsed.valueOf()) ? null : dateKey(parsed);
    }

    return null;
  }

  function displayDate(date) {
    if (!date) return '';
    const parsed = new Date(`${date}T00:00:00`);
    return parsed.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function categoryFor(task) {
    const date = exactDateFor(task);
    const daysAway = date ? Math.round((new Date(`${date}T00:00:00`) - today) / 86400000) : null;

    if (urgencyWords.test(task) || (daysAway !== null && daysAway <= 2)) {
      return { category: 'important', reason: `Immediate deadline or urgency${date ? ` (${date})` : ''}.`, date };
    }
    if (weekWords.test(task) || (daysAway !== null && daysAway <= 7)) {
      return { category: 'week', reason: `Near-term deadline or preparation${date ? ` (${date})` : ''}.`, date };
    }
    return { category: 'later', reason: date ? `Future goal or deadline (${date}).` : 'No immediate deadline or urgency was detected.', date };
  }

  function splitDump(value) {
    return value.replace(/[.!?]+/g, ',').replace(/\s+and\s+/gi, ',').split(/[\n,]+/)
      .map(cleanTask).filter(task => task.length > 2);
  }

  function breakDown(task) {
    if (/science project|project.*due/i.test(task) && /research|presentation|practice|haven't started|not started/i.test(task)) {
      return [
        { text: 'Start science project', forced: 'important', reason: 'The project is due and has not started.' },
        { text: 'Research topic', forced: 'important', reason: 'Research is a dependency for the project.' },
        { text: 'Make presentation', forced: 'week', reason: 'This is a project step to complete before the deadline.' },
        { text: 'Practice presentation', forced: 'week', reason: 'Practice is a project step to complete before presenting.' }
      ];
    }
    return [{ text: task }];
  }

  for (let hour = 1; hour <= 12; hour += 1) {
    document.querySelector('#due-hour').insertAdjacentHTML('beforeend', `<option value="${hour}">${hour}</option>`);
  }
  for (let minute = 0; minute <= 59; minute += 1) {
    document.querySelector('#due-minute').insertAdjacentHTML('beforeend', `<option value="${minute}">${String(minute).padStart(2, '0')}</option>`);
  }

  function saveTasks() {
    localStorage.setItem('unjumble-tasks', JSON.stringify(tasks));
  }

  function addTask(text, due, forcedCategory, suppliedReason) {
    const classification = categoryFor(text);
    const category = forcedCategory || classification.category;
    tasks[category].push({
      text, due,
      date: classification.date,
      reason: suppliedReason || classification.reason,
      done: false,
      createdAt: Date.now(),
      id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`
    });
  }

  function formatDue(due) {
    return due ? ` \u00b7 ${due.hour}:${String(due.minute).padStart(2, '0')} ${due.period}` : '';
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[character]));
  }

  function findTask(id) {
    return Object.values(tasks).flat().find(task => task.id === id);
  }

  function mostRecentTask() {
    return Object.values(tasks).flat().reduce((latest, task) =>
      !latest || task.createdAt > latest.createdAt ? task : latest, null);
  }

  function applyConversationUpdate(value) {
    const lower = value.toLowerCase().trim();
    const task = mostRecentTask();
    if (!task) return false;

    const mentionsReferent = /\b(?:that|it)\b/.test(lower);

    if (mentionsReferent && /\b(?:already\s+)?(?:done|finished)\b/.test(lower)) {
      task.done = true;
      return { task, note: `Marked "${task.text}" as done.` };
    }

    if (mentionsReferent && /\breally\s+important\b|\bmake\s+(?:that|it)\s+important\b/.test(lower)) {
      const current = Object.keys(tasks).find(category => tasks[category].includes(task));
      tasks[current] = tasks[current].filter(item => item !== task);
      tasks.important.push(task);
      task.reason = 'Updated because you marked it as important.';
      return { task, note: `Moved "${task.text}" to Important.` };
    }

    const changesDate = /\b(?:actually|change|update)\b/.test(lower);
    const hasDateWord = /due|deadline|monday|tuesday|wednesday|thursday|friday|saturday|sunday|today|tomorrow/.test(lower);
    if (mentionsReferent && changesDate && hasDateWord) {
      const date = exactDateFor(value);
      if (!date) return false;
      const current = Object.keys(tasks).find(category => tasks[category].includes(task));
      const classification = categoryFor(`${task.text} ${value}`);
      tasks[current] = tasks[current].filter(item => item !== task);
      task.date = date;
      task.reason = `Updated deadline to ${date}.`;
      tasks[classification.category].push(task);
      return { task, note: `Updated "${task.text}" to ${displayDate(date)}.` };
    }

    return false;
  }

  function moveTask(id) {
    const task = findTask(id);
    const current = Object.keys(tasks).find(category => tasks[category].includes(task));
    const next = current === 'important' ? 'week' : current === 'week' ? 'later' : 'important';
    tasks[current] = tasks[current].filter(item => item !== task);
    tasks[next].push(task);
    saveTasks();
    render();
  }

  function deleteTask(id) {
    Object.keys(tasks).forEach(category => {
      tasks[category] = tasks[category].filter(task => task.id !== id);
    });
    saveTasks();
    render();
  }

  function render() {
    Object.entries(tasks).forEach(([category, items]) => {
      const list = document.querySelector(`#${category}`);
      list.innerHTML = items.length ? items.map(task => {
        const status = task.done ? 'Done' : category === 'important' ? 'Needs attention' : category === 'week' ? 'On your radar' : 'No rush';
        const dateBadge = task.date ? `<span class="task-date">${displayDate(task.date)}</span>` : '';
        return `
        <li>
          <label>
            <input type="checkbox" data-id="${task.id}" ${task.done ? 'checked' : ''}>
            <span>${escapeHtml(task.text)}</span>
          </label>
          <p><span class="muted">${status}${formatDue(task.due)}</span> ${dateBadge}</p>
          <details>
            <summary>Why?</summary>
            <p>${escapeHtml(task.reason || 'Sorted from the context in your brain dump.')}</p>
          </details>
          <button type="button" class="move" data-action="move" data-id="${task.id}">Move</button>
          <button type="button" class="delete" data-action="delete" data-id="${task.id}">Delete</button>
        </li>`;
      }).join('') : '<li class="muted">Nothing here yet.</li>';
      document.querySelector(`#${category}-count`).textContent = `(${items.length})`;
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(box => {
      box.addEventListener('change', () => {
        findTask(box.dataset.id).done = box.checked;
        saveTasks();
        render();
      });
    });
    document.querySelectorAll('[data-action="move"]').forEach(button => {
      button.addEventListener('click', () => moveTask(button.dataset.id));
    });
    document.querySelectorAll('[data-action="delete"]').forEach(button => {
      button.addEventListener('click', () => deleteTask(button.dataset.id));
    });
  }

  document.querySelector('#composer').addEventListener('submit', event => {
    event.preventDefault();
    const dump = document.querySelector('#dump');
    const message = document.querySelector('#composer-message');

    if (!looksUnderstandable(dump.value)) {
      message.textContent = 'Try writing an action, like \u201cemail my teacher\u201d or \u201cstudy for math.\u201d I could not find a clear task in that text.';
      dump.focus();
      return;
    }

    const update = applyConversationUpdate(dump.value);
    if (update) {
      message.textContent = update.note;
      dump.value = '';
      saveTasks();
      render();
      dump.focus();
      return;
    }

    const hour = document.querySelector('#due-hour').value;
    const minute = document.querySelector('#due-minute').value;
    const period = document.querySelector('#due-period').value;
    const due = hour && minute !== '' && period ? { hour, minute, period } : null;

    const repairedText = repairTypos(dump.value);
    const parsedTasks = /science project|presentation.*practice/i.test(repairedText)
      ? breakDown(repairedText)
      : splitDump(repairedText).flatMap(breakDown);

    parsedTasks.forEach(task => addTask(task.text, due, task.forced, task.reason));

    message.textContent = repairedText !== dump.value
      ? 'I cleaned up a few likely typos and sorted your tasks.'
      : 'Tasks added and sorted.';

    dump.value = '';
    document.querySelector('#due-hour').value = '';
    document.querySelector('#due-minute').value = '';
    document.querySelector('#due-period').value = '';
    saveTasks();
    render();
    dump.focus();
  });

  render();
</script>

</body>
</html>
